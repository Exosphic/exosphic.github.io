<section class="services-section" id="services">
  <div class="section-container">
    <div class="section-intro">
      <span class="section-tag">{{ site.data.content.services.title }}</span>
      <h2 class="section-title">{{ site.data.content.services.subtitle }}</h2>
    </div>

    <div class="services-grid">
      {% for service in site.data.content.services.items %}
      <div class="service-card">
        <div class="service-glow-border"></div>
        <div class="service-content">
          <h3 class="service-title">{{ service.name }}</h3>
          <p class="service-description">{{ service.description }}</p>
          <!-- <div class="service-learn-more">
              <span>Learn more</span>
              <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </div> -->
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
