<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.data.content.brand.name }} | {{ site.data.content.brand.tagline }}</title>

  <!-- Security Headers (CSP) -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';">

  <!-- SEO Meta Tags -->
  <meta name="description" content="{{ site.data.content.brand.purpose }}">
  <meta name="author" content="{{ site.data.content.brand.name }}">
  <meta name="robots" content="index, follow">

  <!-- OpenGraph Meta Tags -->
  <meta property="og:title" content="{{ site.data.content.brand.name }} | {{ site.data.content.brand.tagline }}">
  <meta property="og:description" content="{{ site.data.content.brand.purpose }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.data.content.brand.name }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/images/site.webmanifest' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <!-- Header Navigation Included dynamically -->
  {% include header.html %}

  <!-- Main Content Body -->
  <main id="main-content">
    {{ content }}
  </main>

  <!-- Footer Included dynamically -->
  {% include footer.html %}

  <!-- JavaScript -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>

</html>
